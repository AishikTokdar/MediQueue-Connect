version: '3.8'

services:
  health_server:
    build: .
    container_name: mediqueue_health_server
    command: python server/health_server.py
    ports:
      - "4000:4000"
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mediqueue_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mediqueue_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: mediqueue_celery_worker
    command: celery -A server.celery_app worker --loglevel=info
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped

  websocket_gateway:
    build: .
    container_name: mediqueue_websocket_gateway
    command: python server/websocket_gateway.py
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - health_server
    restart: unless-stopped
