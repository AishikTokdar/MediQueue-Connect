version: '3.8'

services:
  health_server:
    build: .
    container_name: mediqueue_health_server
    command: python server/health_server.py
    ports:
      - "4000:4000"
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mediqueue_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  websocket_gateway:
    build: .
    container_name: mediqueue_websocket_gateway
    command: python server/websocket_gateway.py
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - health_server
    restart: unless-stopped
